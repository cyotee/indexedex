# Deploy marketing/research-site to https://cyotee.github.io/indexedex/
name: Deploy research site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "marketing/research-site/**"
      - ".github/workflows/deploy-research-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Ensure .nojekyll
        run: touch marketing/research-site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: marketing/research-site

      - id: deployment
        uses: actions/deploy-pages@v4
