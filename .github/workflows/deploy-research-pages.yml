# Deploy marketing/research-site to GitHub Pages: https://cyotee.github.io/indexedex/
#
# Dual publish:
# 1) peaceiris → gh-pages branch (static backup / raw content)
# 2) actions/deploy-pages → official GitHub Pages environment (when not hung)
name: Deploy research site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "marketing/research-site/**"
      - ".github/workflows/deploy-research-pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure .nojekyll
        run: touch marketing/research-site/.nojekyll

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./marketing/research-site
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: marketing/research-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
