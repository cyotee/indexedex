# Deploy marketing/research-site (static DETF research landing + litepaper PDF)
# to GitHub Pages: https://cyotee.github.io/indexedex/
name: Deploy research site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "marketing/research-site/**"
      - ".github/workflows/deploy-research-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Allow a newer push to supersede a hung deploy-pages queue.
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: marketing/research-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
