# Deploy marketing/research-site (static DETF research landing + litepaper PDF)
# to GitHub Pages: https://cyotee.github.io/indexedex/
#
# Uses gh-pages branch publish (peaceiris) instead of actions/deploy-pages.
# Official deploy-pages was hanging in deployment_queued / in_progress for this repo.
name: Deploy research site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "marketing/research-site/**"
      - ".github/workflows/deploy-research-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish marketing/research-site to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./marketing/research-site
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
