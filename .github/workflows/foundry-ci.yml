# Foundry CI — hermetic only (default profile → test/foundry/spec).
#
# Intentionally does NOT run FOUNDRY_PROFILE=fork (test/foundry/fork).
# Also excludes misplaced *Fork* / **/fork/** cases under spec that call
# createSelectFork, so CI never hammers Alchemy/RPC rate limits.
#
# This workflow does not control Vercel: frontend deploys from Git integration
# on push; they are not gated on this job.
#
# Docs: docs/ci.md
name: Foundry CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: foundry-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hermetic:
    name: Build + hermetic tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Never inject RPC credentials — even if org secrets exist with these names.
    env:
      ALCHEMY_KEY: ""
      BASE_RPC_URL: ""
      ETH_RPC_URL: ""
      ROBINHOOD_RPC_URL: ""
      FOUNDRY_ETH_RPC_URL: ""
      FOUNDRY_BASE_RPC_URL: ""
      FOUNDRY_ROBINHOOD_RPC_URL: ""
    steps:
      - name: Checkout (recursive submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show forge version
        run: forge --version

      - name: Cache forge artifacts
        uses: actions/cache@v4
        with:
          path: |
            out
            cache_forge
            ~/.svm
          key: forge-hermetic-${{ runner.os }}-${{ hashFiles('foundry.toml', 'remappings.txt', 'lib/crane/**/*.sol') }}
          restore-keys: |
            forge-hermetic-${{ runner.os }}-

      - name: Forge build (default profile)
        run: forge build

      - name: Forge test (hermetic only — no fork / no RPC)
        # default profile → test/foundry/spec (sizes=false in foundry.toml)
        # Exclude misplaced fork suites under spec (createSelectFork / live RPC):
        #   --no-match-path  → any **/fork/** directory
        #   --no-match-contract → *Fork* / *ForkSmoke* contract names
        # (forge allows only one of each flag). True fork suite remains local:
        #   FOUNDRY_PROFILE=fork forge test
        run: >
          forge test -vv
          --no-match-path '**/fork/**'
          --no-match-contract 'Fork'
