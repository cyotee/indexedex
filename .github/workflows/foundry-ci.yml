# Foundry CI — hermetic only (default profile → test/foundry/spec).
# Fork suites (FOUNDRY_PROFILE=fork) are local/manual; not run on Actions.
# Docs: docs/ci.md
name: Foundry CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: foundry-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hermetic:
    name: Build + hermetic tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout (recursive submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show forge version
        run: forge --version

      - name: Cache forge artifacts
        uses: actions/cache@v4
        with:
          path: |
            out
            cache_forge
            ~/.svm
          key: forge-hermetic-${{ runner.os }}-${{ hashFiles('foundry.toml', 'remappings.txt', 'lib/crane/**/*.sol') }}
          restore-keys: |
            forge-hermetic-${{ runner.os }}-

      - name: Forge build (default profile)
        run: forge build

      - name: Forge test (hermetic / default profile)
        # default → test/foundry/spec (sizes=false in foundry.toml)
        run: forge test -vv
