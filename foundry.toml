# Foundry profiles — ONLY two product gates (see docs/ci.md "Profile law").
# - default: hermetic / local  → test/foundry/spec
# - fork:    network forks     → test/foundry/fork  (needs ALCHEMY_KEY / RPC)
# Do NOT add package profiles. Focus with --match-path / --match-contract.
# NEVER enable via_ir — fix stack-too-deep with structs / helper frames.

[profile.default]
src = 'contracts'
out = 'out'
libs = ['node_modules', 'lib']
test = 'test/foundry/spec'
cache_path = 'cache_forge'
ffi = true
fs_permissions = [
    { access = "read-write", path = "./"}
]
ignored_error_codes = [
    2394,
    3860,
    5574,
    2072,
    # Invalid NatSpec custom tag (upstream Crane issue with @custom:topic0)
    2968,
    # Function state mutability can be restricted to pure
    2018,
    # Unused function parameter. Remove or comment out the variable name to silence this warning.
    5667
]
solc = "0.8.35"
ignored_warnings_from = ["lib/crane/"]
# sizes=false keeps CI/local logs quiet; use `forge build --sizes` when measuring.
sizes = false
optimizer = true
optimizer_runs = 1
# NEVER enable via_ir - use structs to fix stack-too-deep instead
via_ir = false
# Headroom for auto-mine / dense hook-package deploys under the full hermetic suite.
gas_limit = 30000000000

# Explicit fork gate (do not rely on inherits for test= path — flaky on some Foundry versions).
[profile.fork]
src = 'contracts'
out = 'out'
libs = ['node_modules', 'lib']
test = 'test/foundry/fork'
cache_path = 'cache_forge'
ffi = true
fs_permissions = [
    { access = "read-write", path = "./"}
]
ignored_error_codes = [
    2394,
    3860,
    5574,
    2072,
    2968,
    2018,
    5667
]
solc = "0.8.35"
ignored_warnings_from = ["lib/crane/"]
sizes = false
optimizer = true
optimizer_runs = 1
via_ir = false
gas_limit = 30000000000

[profile.default.fmt]
skip = ["lib/"]

[lint]
exclude_lints = [
    "erc20-unchecked-transfer",
    "unused-import",
    "mixed-case-variable",
    "mixed-case-function",
    "unaliased-plain-import",
    "screaming-snake-case-immutable",
    "screaming-snake-case-const",
    "pascal-case-struct",
    "incorrect-shift",
    "divide-before-multiply",
    "modifier-style",
    "unsafe-typecast",
    "unwrapped-modifier-logic",
    "unsafe-cheatcode",
    "named-struct-fields"
]
ignore = [
    "lib/crane/",
    "contracts/vaults/basic/BasicVaultErrors.sol",
    "test/foundry/fork/archive/sepolia/EthereumProtocolDETFSyntheticPrice_SuperSimFork.t.sol",
    "lib/crane/test/foundry/fork/ethereum/protocols/staking/liquity/v2/gov/VotingPower.t.sol",
    "lib/crane/contracts/protocols/tokens/stable/frax/Common/Ownable.sol",
    "lib/crane/contracts/protocols/lending/aave/v3.6/dependencies/openzeppelin/contracts/AccessControl.sol",
    "lib/crane/contracts/protocols/tokens/stable/frax/Governance/AccessControl.sol",
    "lib/crane/test/foundry/spec/protocols/staking/liquity/v2/gov/BribeInitiativeAllocate.t.sol"
]

[rpc_endpoints]
local = "http://127.0.0.1:8545"
ethereum_mainnet_infura = "https://mainnet.infura.io/v3/${INFURA_KEY}"
ethereum_mainnet_alchemy = "https://eth-mainnet.g.alchemy.com/v2/${ALCHEMY_KEY}"
ethereum_sepolia_infura = "https://sepolia.infura.io/v3/${INFURA_KEY}"
sepolia_infura = "https://sepolia.infura.io/v3/${INFURA_KEY}"
ethereum_sepolia_alchemy = "https://eth-sepolia.g.alchemy.com/v2/${ALCHEMY_KEY}"
sepolia_alchemy = "https://eth-sepolia.g.alchemy.com/v2/${ALCHEMY_KEY}"
# Public Sepolia fallback for L1→BattleChain bridge scripts
sepolia_public = "https://ethereum-sepolia-rpc.publicnode.com"
# BattleChain testnet (chain 627) settles to Ethereum Sepolia
"battlechain-sepolia" = "https://testnet.battlechain.com"
battlechain_testnet = "https://testnet.battlechain.com"
battlechain_mainnet = "https://mainnet.battlechain.com"

base_mainnet_infura = "https://base-mainnet.infura.io/v3/${INFURA_KEY}"
base_mainnet_alchemy = "https://base-mainnet.g.alchemy.com/v2/${ALCHEMY_KEY}"
base_sepolia_infura = "https://base-sepolia.infura.io/v3/${INFURA_KEY}"
base_sepolia_alchemy = "https://base-sepolia.g.alchemy.com/v2/${ALCHEMY_KEY}"

optimism_mainnet = "https://opt-mainnet.g.alchemy.com/v2/${ALCHEMY_KEY}"

fantom_mainnet = "https://fantom.drpc.org"

apeChain_rpc = "https://rpc.apechain.com"
apeChain_drpc = "https://apechain.drpc.org"
apeChain_curtis_rpc = "https://rpc.curtis.apechain.com"

# Robinhood Chain (Arbitrum Orbit L2) — chain 4663 mainnet / 46630 testnet
# Public RPCs are rate-limited; Alchemy recommended for production forks.
robinhood_mainnet = "https://rpc.mainnet.chain.robinhood.com"
robinhood_mainnet_public = "https://rpc.mainnet.chain.robinhood.com"
robinhood_mainnet_alchemy = "https://robinhood-mainnet.g.alchemy.com/v2/${ALCHEMY_KEY}"
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"
robinhood_testnet_public = "https://rpc.testnet.chain.robinhood.com"
robinhood_testnet_alchemy = "https://robinhood-testnet.g.alchemy.com/v2/${ALCHEMY_KEY}"
# Research harness scripts only (Mode A/C telemetry). Allows via_ir for stack headroom
# in large TestBase inheritance trees. Do NOT use for production contract builds.

